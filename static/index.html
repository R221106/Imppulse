<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imppulse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="Images" href="/Images/Untitled_design__1_-removebg-preview.png">

</head>
<body>
    <div id="page-loader">
        <div class="loader-content">
            <h2>Market Tracker</h2>
            <p>Loading...</p>
            <div class="loader-spinner"></div>
        </div>
    </div>
    <nav class="sidebar">
        <header>
            <div class="nav-menu">
                <img class="toggle-menu" src="/Images/Nav-Menu.png" alt="Nav-Menu">

            </div>

            <div class="menu-bar">
                <div class="menu">
                    <ul class="menu-links">
                        <li class="nav-link">
                            <a href="index.html">
                                <img class="icons" src="/Images/Home.png" alt="Home-Icon">
                                <span class="text nav-text">Home</span>
                            </a>
                        </li>
                        <li class="nav-link">
                            <a href="search.html">
                                <img class="icons" src="/Images/SearchButton.png" alt="Graph-Icon">
                                <span class="text nav-text">Search</span>
                            </a>
                        </li>
                        <li class="nav-link">
                            <a href="dashboard.html">
                                <img class="icons" src="/Images/Dashboard.png" alt="Dashboard-Icon">
                                <span class="text nav-text">Dashboard</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
    </nav>
    <section class="main">
        <video autoplay loop muted playsinline class="backgroundVideo">
            <source src="/Videos/Background.mp4" type="video/mp4">
        </video>
        <div class="overlayer"></div>
        <div class="content"> 
            <h1>IMP-PULSE</h1> 
            <div class="search-input">
                <input id="search-input" type="text" autocomplete="off" placeholder="Search whats in the Market....">                    
                <button id="search-button" type="submit">
                    <img src="/Images/SearchButton.png" alt="seachButtonImg">
                </button>
            </div>
            <div class="infinite-tracker">
                <div id="infinite-track">
                </div>
            </div>
        </div>
    </section>
    <footer class="footer-box">
        <div class="footer-info">

            <p>Built with Flask · JavaScript · Chart.js · Python </p>
            <p><i>© 2026 Market Narrative Tracker. All rights reserved.</i></p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
